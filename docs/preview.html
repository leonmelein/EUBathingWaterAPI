<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bathing Water Locations</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --bg: #65bfff;
      --panel: rgba(255, 255, 255, 0.92);
      --text: #102018;
      --muted: #5a6b62;
      --accent: #0f766e;
      --accent-2: #14b8a6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(20, 184, 166, 0.16), transparent 45%),
        radial-gradient(circle at 90% 20%, rgba(0, 166, 255, 0.12), transparent 40%),
        var(--bg);
    }

    .layout {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(16, 32, 24, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(16, 32, 24, 0.06);
    }

    .header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    #map {
      min-height: 70vh;
      height: calc(100vh - 88px);
      border-radius: 12px;
      overflow: hidden;
    }

    .status-error {
      color: #b91c1c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="panel header">
      <h1>Bathing Water Locations</h1>
      <div id="status" class="meta">Loading GeoJSON…</div>
    </div>
    <div id="map" class="panel" aria-label="Map of bathing water locations"></div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const statusEl = document.getElementById("status");
    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true
    }).setView([54, 15], 4);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const countryCodes = [
      "at", "be", "ch", "cz", "de", "dk", "ee", "gr",
      "hr", "hu", "ie", "lt", "lu", "lv", "nl", "pl",
      "se", "sk", "uk"
    ];

    async function loadCountryGeoJson(isoCode) {
      const path = `../data/${isoCode}/locations.geojson`;
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }
      const geojson = await response.json();
      return { isoCode, path, geojson };
    }

    function popupHtml(feature) {
      const props = feature?.properties ?? {};
      const name = props.name ?? "Unnamed location";
      const extra = Object.entries(props)
        .filter(([key]) => key !== "name")
        .slice(0, 6)
        .map(([key, value]) => `<div><strong>${key}</strong>: ${String(value)}</div>`)
        .join("");

      return `<div><strong>${name}</strong>${extra ? `<hr>${extra}` : ""}</div>`;
    }

    Promise.allSettled(countryCodes.map((isoCode) => loadCountryGeoJson(isoCode)))
      .then((results) => {
        const palette = ["#0f766e", "#0369a1", "#1d4ed8", "#6d28d9", "#b91c1c", "#15803d", "#854d0e"];
        const overlays = {};
        const allLayers = [];
        let loadedLayers = 0;
        let failedLayers = 0;
        let totalCount = 0;

        results.forEach((result, index) => {
          if (result.status !== "fulfilled") {
            failedLayers += 1;
            return;
          }

          const { isoCode, geojson } = result.value;
          const color = palette[index % palette.length];
          const layer = L.geoJSON(geojson, {
            pointToLayer: (_, latlng) => L.circleMarker(latlng, {
              radius: 4,
              weight: 1,
              color,
              fillColor: color,
              fillOpacity: 0.75
            }),
            onEachFeature: (feature, featureLayer) => {
              featureLayer.bindPopup(popupHtml(feature), { maxWidth: 280 });
            }
          }).addTo(map);

          const count = Array.isArray(geojson.features) ? geojson.features.length : 0;
          totalCount += count;
          loadedLayers += 1;
          overlays[`${isoCode.toUpperCase()} (${count.toLocaleString()})`] = layer;
          allLayers.push(layer);
        });

        if (allLayers.length > 0) {
          const group = L.featureGroup(allLayers);
          const bounds = group.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds.pad(0.05));
          }
          L.control.layers(null, overlays, { collapsed: false }).addTo(map);
        }

        if (loadedLayers === 0) {
          throw new Error("No country GeoJSON files could be loaded");
        }

        statusEl.textContent = `Loaded ${totalCount.toLocaleString()} locations from ${loadedLayers} country layers${failedLayers ? ` (${failedLayers} failed)` : ""}`;
      })
      .catch((error) => {
        console.error(error);
        statusEl.textContent = `Failed to load country GeoJSON layers: ${error.message}`;
        statusEl.classList.add("status-error");
      });
  </script>
</body>
</html>
