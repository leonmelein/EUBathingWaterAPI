<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimspots</title>
    <link rel="stylesheet" href="src/favorites.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/192.png" />
    <link rel="me" href="https://mastodon.social/@swimspots" />
    <meta name="fediverse:creator" content="@swimspots@mastodon.social" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <header class="panel header map-header">
      <a
        class="brand-block brand-link"
        href="index.html"
        aria-label="Swimspots home"
      >
        <h1>
          <img class="brand-mark" src="swimspots-logo.png" alt="" />
          <span class="brand-name">Swimspots.eu</span>
        </h1>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a class="nav-link" href="index.html" aria-current="page">
          <span class="material-symbols-outlined">map_search</span>
        </a>
        <a class="nav-link active" href="favorites.html">
          <span class="material-symbols-outlined">favorite</span>
        </a>
        <a class="nav-link" href="about.html">
          <span class="material-symbols-outlined">info</span>
        </a>
      </nav>
    </header>

    <div id="content">
      <h1 class="cta">Favorites</h1>
      <div class="favorites"></div>
    </div>

    <template id="favorite">
      <div class="favorite">
        <h2><slot id="title" name="title">Placeholder title</slot></h2>
        <p><slot id="country" name="country">🇳🇱 Example country</slot></p>
      </div>
    </template>

    <div class="footer">
      <div>
        <a
          class="brand-block brand-link"
          href="index.html"
          aria-label="Swimspots home"
        >
          <img class="brand-mark" src="swimspots-logo.png" alt="" />
          <h3>
            <span>Swimspots.eu</span>
          </h3>
        </a>
        Data from the <a href="#">EU Bathing Water API</a>.<br />
        Powered by 2006/7/EC and the environmental agencies of Europe ♥️.
      </div>
      <div>
        <h3>Follow us on</h3>
        <ul class="links">
          <li>
            <img src="./github.svg" />
            <a
              href="https://github.com/leonmelein/eubathingwaterapi"
              target="_blank"
              >GitHub</a
            >
          </li>
          <li>
            <img src="./mastodon.svg" />
            <a href="https://mastodon.social/@swimspots" target="_blank"
              >Mastodon</a
            >
          </li>
          <li>
            <img src="./bluesky.svg" />
            <a href="https://bsky.app/profile/swimspots.eu" target="_blank"
              >Bluesky</a
            >
          </li>
        </ul>
      </div>
    </div>
    <script type="module" src="src/favorites.ts"></script>
  </body>
</html>
