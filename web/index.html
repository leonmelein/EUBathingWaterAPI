<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimspots</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/192.png" />
    <link rel="me" href="https://mastodon.social/@swimspots" />
    <meta name="fediverse:creator" content="@swimspots@mastodon.social" />
  </head>
  <body>
    <div class="panel header map-header">
      <a
        class="brand-block brand-link"
        href="index.html"
        aria-label="Swimspots home"
      >
        <h1>
          <img class="brand-mark" src="swimspots-logo.png" alt="" />
          <span class="brand-name">Swimspots.eu</span>
        </h1>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a class="nav-link active" href="index.html" aria-current="page">Map</a>
        <a class="nav-link" href="search.html">Favorites</a>
        <a class="nav-link" href="about.html">About</a>
      </nav>
    </div>

    <div class="detail-card panel" id="dialog" popover="auto">
      <div class="location-header">
        <h2 id="title"></h2>
        <div id="closeDialog" class="btn">
          <span>Ⅹ</span>
        </div>
      </div>
      <p id="country"></p>
      <div class="actions">
        <div class="btn action-btn favorite">
          <span class="icon">♥️</span>
          <p>Add to Favorites</p>
        </div>
      </div>
    </div>

    <div id="map" aria-label="Map of bathing water locations"></div>
    <!-- 
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script> -->
    <!-- <script src="map.js"></script> -->
    <script type="module" src="dist/map.js"></script>
  </body>
</html>
